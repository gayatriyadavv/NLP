name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies (CPU)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install torch_geometric easyocr matplotlib networkx pyyaml numpy scipy scikit-learn \
                      pillow opencv-python-headless PyMuPDF fastapi uvicorn pydantic pytest httpx
      - name: Cache EasyOCR weights
        uses: actions/cache@v4
        with:
          path: ~/.EasyOCR
          key: easyocr-en-v1
      - name: Run tests
        run: python -m pytest tests/ -q -rs

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
